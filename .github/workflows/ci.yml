name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - name: Catalog in sync, unit and integration tests (no API key needed)
        run: npm test

  live-smoke:
    name: Live API smoke test
    # Real API calls cost money: only on main or on demand, and only when the
    # repository has an ANTHROPIC_API_KEY secret.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
        if: env.ANTHROPIC_API_KEY != ''
      - run: npm run smoke:live
        if: env.ANTHROPIC_API_KEY != ''
      - name: Skipped (no ANTHROPIC_API_KEY secret)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Add an ANTHROPIC_API_KEY repository secret to enable the live smoke test."
