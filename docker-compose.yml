name: prompt-engineering-stack

services:

  # PromptForge — AI Prompt Engineering Studio (port 3000)
  promptforge:
    container_name: promptforge
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HELICONE_API_KEY: ${HELICONE_API_KEY:-}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-10}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      # Free models through an OpenAI-compatible gateway (no Anthropic key needed).
      # With the `free` profile below: LLM_GATEWAY_URL=http://omniroute:20128/v1
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-}
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-}
      LLM_GATEWAY_NAME: ${LLM_GATEWAY_NAME:-}
      LLM_GATEWAY_MODELS: ${LLM_GATEWAY_MODELS:-}
      LLM_GATEWAY_DEFAULT_MODEL: ${LLM_GATEWAY_DEFAULT_MODEL:-}
      LLM_GATEWAY_JUDGE_MODEL: ${LLM_GATEWAY_JUDGE_MODEL:-}
      GATEWAY_DAILY_REQUEST_LIMIT: ${GATEWAY_DAILY_REQUEST_LIMIT:-1000}

  # OmniRoute — self-hosted AI gateway that routes to providers' free tiers
  # (https://github.com/diegosouzapw/OmniRoute). Opt-in:
  #   docker compose --profile free up -d
  # Then open http://localhost:20128, connect providers with your OWN free API
  # keys (Groq, Cerebras, Gemini API, OpenRouter, NVIDIA NIM, ...), create an
  # API key under Endpoints, and set LLM_GATEWAY_KEY to it.
  omniroute:
    container_name: omniroute
    image: ${OMNIROUTE_IMAGE:-docker.io/diegosouzapw/omniroute:latest}
    profiles: ["free"]
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      # Required by OmniRoute. Set both in .env; generate each with: openssl rand -hex 32
      JWT_SECRET: "${OMNIROUTE_JWT_SECRET:-}"
      API_KEY_SECRET: "${OMNIROUTE_API_KEY_SECRET:-}"
      # Leave empty to choose the dashboard password in the first-run wizard.
      INITIAL_PASSWORD: "${OMNIROUTE_INITIAL_PASSWORD:-}"
      # PromptForge always sends a key; require one so the proxy is never open.
      REQUIRE_API_KEY: "true"
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute_data:/app/data
    security_opt:
      - no-new-privileges:true

  # Open Design — local-first design agent tool (port 7456)
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-docker.io/vanjayak/open-design:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: 7456
      OD_API_TOKEN: "${OD_API_TOKEN}"
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
    ports:
      - "127.0.0.1:7456:7456"
    volumes:
      - open_design_data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
  omniroute_data:
